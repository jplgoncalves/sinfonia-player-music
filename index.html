<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinfonia - Player de Música Grátis</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="player-container">
        <div class="music-info">
            <div class="cover-art">
                <img id="track-cover" src="https://picsum.photos/id/1025/300/300" alt="Capa do Álbum">
            </div>
            <h2 id="track-title">Título da Música</h2>
            <h3 id="track-artist">Artista</h3>
        </div>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="time-info">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <audio id="audio-player" src=""></audio>

        <div class="controls">
            <button id="prev-btn" class="control-btn"><i class="fas fa-step-backward"></i></button>
            <button id="play-btn" class="control-btn play-main"><i class="fas fa-play"></i></button>
            <button id="next-btn" class="control-btn"><i class="fas fa-step-forward"></i></button>
        </div>

        <div class="playlist">
            <h3>Sua Playlist</h3>
            <ul id="playlist-tracks">
                </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
